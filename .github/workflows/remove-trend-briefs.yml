name: Remove public trend briefs

on:
  push:
    branches:
      - remove-trend-briefs
  pull_request:
    branches:
      - main
    paths:
      - .remove-trend-briefs-trigger
      - tools/remove_trend_briefs.py
      - .github/workflows/remove-trend-briefs.yml

permissions:
  contents: write

jobs:
  remove:
    if: github.event_name == 'pull_request' || contains(github.event.head_commit.message, '[run-remove-trend-briefs]')
    runs-on: ubuntu-latest
    steps:
      - name: Check out removal branch
        uses: actions/checkout@v4
        with:
          ref: remove-trend-briefs
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Remove and validate public briefs
        run: python tools/remove_trend_briefs.py

      - name: Commit verified removal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: remove public trend briefs"
          git push origin HEAD:remove-trend-briefs
