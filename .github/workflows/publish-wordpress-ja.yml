name: Delete retired WordPress brief

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/wordpress-publish-trigger

permissions:
  contents: read

concurrency:
  group: wordpress-ja-publish
  cancel-in-progress: false

jobs:
  delete:
    if: github.head_ref == 'wordpress-publish'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements-wordpress.txt

      - name: Run publisher tests
        run: python -m unittest discover -s tests -v

      - name: Validate retained edition
        run: python tools/wordpress_publish.py wordpress/ja/2026-08-01/wordpress.yml

      - name: Delete retired post and verify retained posts
        env:
          WP_SITE_URL: https://tankiji.com
          WP_USERNAME: horse
          WP_APPLICATION_PASSWORD: ${{ secrets.TANKIJI }}
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import time
          from pathlib import Path

          from tools.wordpress_publish import (
              WordpressClient,
              load_manifest,
              parse_markdown_file,
          )

          target_slug = '2026-08-01-briefs'
          client = WordpressClient(
              os.environ['WP_SITE_URL'],
              os.environ['WP_USERNAME'],
              os.environ['WP_APPLICATION_PASSWORD'],
          )

          def request_with_retry(method, endpoint, *, query=None):
              errors = []
              for attempt in range(1, 7):
                  try:
                      return client.request(method, endpoint, query=query)
                  except RuntimeError as error:
                      errors.append(str(error))
                      if attempt == 6:
                          raise RuntimeError(json.dumps({
                              'request': f'{method} {endpoint}',
                              'attempts': attempt,
                              'errors': errors,
                          }, ensure_ascii=False)) from error
                      time.sleep(min(5 * attempt, 30))
              raise AssertionError('unreachable')

          manifest_path = Path('wordpress/ja/2026-08-01/wordpress.yml')
          manifest = load_manifest(manifest_path)
          content_dir = Path(manifest['content_dir'])
          retained_slugs = []
          for filename in manifest['posts']:
              meta, _ = parse_markdown_file(content_dir / filename)
              retained_slugs.append(str(meta['slug']))

          if len(retained_slugs) != 30 or len(set(retained_slugs)) != 30:
              raise RuntimeError(f'expected 30 unique retained slugs, found {len(retained_slugs)}')
          if target_slug in retained_slugs:
              raise RuntimeError('retired slug remains in publication manifest')

          matches = request_with_retry(
              'GET',
              'posts',
              query={
                  'slug': target_slug,
                  'status': 'any',
                  'context': 'edit',
                  'per_page': 100,
              },
          )
          deleted = []
          for post in matches:
              result = request_with_retry(
                  'DELETE',
                  f"posts/{post['id']}",
                  query={'force': 'true'},
              )
              if not result.get('deleted'):
                  raise RuntimeError(f"WordPress did not permanently delete post {post['id']}")
              previous = result.get('previous', {})
              deleted.append({
                  'id': post['id'],
                  'slug': previous.get('slug', target_slug),
                  'link': previous.get('link', post.get('link')),
              })

          remaining_target = request_with_retry(
              'GET',
              'posts',
              query={
                  'slug': target_slug,
                  'status': 'any',
                  'context': 'edit',
                  'per_page': 100,
              },
          )
          if remaining_target:
              raise RuntimeError('retired WordPress slug still exists after deletion')

          published = request_with_retry(
              'GET',
              'posts',
              query={
                  'status': 'publish',
                  'context': 'edit',
                  'per_page': 100,
                  'after': '2026-08-01T05:59:59',
                  'before': '2026-08-01T06:00:01',
                  'orderby': 'date',
                  'order': 'asc',
              },
          )
          published_slugs = {str(post.get('slug')) for post in published}
          missing = sorted(set(retained_slugs) - published_slugs)

          # Fall back to exact lookups only for any slug not returned by the date window.
          still_missing = []
          for slug in missing:
              posts = request_with_retry(
                  'GET',
                  'posts',
                  query={
                      'slug': slug,
                      'status': 'publish',
                      'context': 'edit',
                      'per_page': 1,
                  },
              )
              if not posts:
                  still_missing.append(slug)

          if still_missing:
              raise RuntimeError(json.dumps({
                  'missing_retained_slugs': still_missing,
              }, ensure_ascii=False))
          if target_slug in published_slugs:
              raise RuntimeError('retired slug remains in published date window')

          print(json.dumps({
              'target_slug': target_slug,
              'deleted_count': len(deleted),
              'deleted': deleted,
              'retained_published_posts': len(retained_slugs),
              'bulk_verified_posts': len(published_slugs & set(retained_slugs)),
          }, ensure_ascii=False, indent=2))
          PY
