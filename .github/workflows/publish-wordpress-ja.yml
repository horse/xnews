name: Publish Japanese WordPress edition

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - .github/wordpress-publish-trigger

permissions:
  contents: read

concurrency:
  group: wordpress-ja-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'pull_request' || github.head_ref == 'wordpress-publish'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements-wordpress.txt

      - name: Run publisher tests
        run: python -m unittest discover -s tests -v

      - name: Validate edition
        run: python tools/wordpress_publish.py wordpress/ja/2026-08-02/wordpress.yml

      - name: Publish to WordPress
        env:
          WP_SITE_URL: https://tankiji.com
          WP_USERNAME: horse
          WP_APPLICATION_PASSWORD: ${{ secrets.TANKIJI }}
        run: python tools/wordpress_publish_safe.py wordpress/ja/2026-08-02/wordpress.yml --publish
