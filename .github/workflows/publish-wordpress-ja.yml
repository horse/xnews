name: Publish Japanese WordPress edition

on:
  workflow_dispatch:
    inputs:
      edition_date:
        description: "Edition date in YYYY-MM-DD; leave blank to publish the latest manifest"
        required: false
        type: string
  pull_request:
    branches:
      - main
    paths:
      - .github/wordpress-publish-trigger

permissions:
  contents: read

concurrency:
  group: wordpress-ja-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'pull_request' || github.head_ref == 'wordpress-publish'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements-wordpress.txt

      - name: Run publisher tests
        run: python -m unittest discover -s tests -v

      - name: Select edition manifest
        id: manifest
        shell: bash
        run: |
          edition="${{ github.event.inputs.edition_date }}"
          if [ -n "$edition" ]; then
            manifest="wordpress/ja/${edition}/wordpress.yml"
          else
            manifest="$(find wordpress/ja -mindepth 2 -maxdepth 2 -name wordpress.yml | sort | tail -n 1)"
          fi
          test -n "$manifest"
          test -f "$manifest"
          echo "manifest=$manifest" >> "$GITHUB_OUTPUT"
          echo "Publishing manifest: $manifest"

      - name: Validate edition
        run: python tools/wordpress_publish.py "${{ steps.manifest.outputs.manifest }}"

      - name: Publish to WordPress
        env:
          WP_SITE_URL: https://tankiji.com
          WP_USERNAME: horse
          WP_APPLICATION_PASSWORD: ${{ secrets.TANKIJI }}
        run: python tools/wordpress_publish_safe.py "${{ steps.manifest.outputs.manifest }}" --publish
