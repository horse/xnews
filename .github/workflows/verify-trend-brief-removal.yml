name: Verify trend brief removal

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/verify-trend-brief-removal.yml
      - assets/data-meta.js
      - assets/ja-meta.js
      - assets/site.js
      - assets/ja-site.js
      - content/ja/2026-08-01/index.md
      - content/ja/2026-08-01/briefs.md
      - 2026/08/01/briefs.html
      - ja/2026/08/01/briefs.html
      - wordpress/ja/2026-08-01/wordpress.yml
      - tests/test_wordpress_publish.py

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install publisher dependencies
        run: python -m pip install -r requirements-wordpress.txt

      - name: Run publisher tests
        run: python -m unittest discover -s tests -v

      - name: Check JavaScript syntax
        run: |
          node --check assets/site.js
          node --check assets/ja-site.js

      - name: Verify preserved news and removed public layer
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          root = Path('.')

          def parse_articles(prefix, variable):
              items = []
              for index in range(1, 6):
                  text = (root / f'assets/{prefix}{index}.js').read_text(encoding='utf-8').strip()
                  pattern = rf'window\.{variable}=\(window\.{variable}\|\|\[\]\)\.concat\((\[.*\])\);$'
                  match = re.fullmatch(pattern, text, flags=re.S)
                  assert match, f'invalid article wrapper: {prefix}{index}.js'
                  items.extend(json.loads(match.group(1)))
              return items

          zh = parse_articles('data-', 'XNEWS_ARTICLES')
          ja = parse_articles('ja-data-', 'XNEWS_JA_ARTICLES')
          assert len(zh) == 29
          assert len(ja) == 29
          assert {item['slug'] for item in zh} == {item['slug'] for item in ja}

          for path in [
              root / 'content/ja/2026-08-01/briefs.md',
              root / '2026/08/01/briefs.html',
              root / 'ja/2026/08/01/briefs.html',
          ]:
              assert not path.exists(), f'public brief file remains: {path}'

          manifest = (root / 'wordpress/ja/2026-08-01/wordpress.yml').read_text(encoding='utf-8')
          posts = [line for line in manifest.splitlines() if line.startswith('  - ')]
          assert len(posts) == 30
          assert posts[-1] == '  - index.md'
          assert all('brief' not in line.lower() for line in posts)

          for path in [root / 'assets/data-meta.js', root / 'assets/ja-meta.js']:
              assert '"briefs"' not in path.read_text(encoding='utf-8')

          for path in [root / 'assets/site.js', root / 'assets/ja-site.js', root / 'content/ja/2026-08-01/index.md']:
              text = path.read_text(encoding='utf-8')
              for term in ['briefs.html', 'renderBriefs', 'トレンド短報', '趋势简讯', '短報26件', '26条简讯']:
                  assert term not in text, f'{term} remains in {path}'

          print(json.dumps({
              'chinese_articles': len(zh),
              'japanese_articles': len(ja),
              'wordpress_sources': len(posts),
              'deleted_public_files': 3,
          }, ensure_ascii=False))
          PY

      - name: Verify protected content was not edited
        run: |
          git fetch origin main
          changed="$(git diff --name-only origin/main...HEAD)"
          echo "$changed"
          if echo "$changed" | grep -Eq '^assets/(data|ja-data)-[1-5]\.js$'; then
            echo 'Protected bilingual article data changed' >&2
            exit 1
          fi
          protected_md="$(echo "$changed" | grep '^content/ja/2026-08-01/.*\.md$' | grep -vE '/(index|briefs)\.md$' || true)"
          if [ -n "$protected_md" ]; then
            echo "Protected Japanese article Markdown changed: $protected_md" >&2
            exit 1
          fi
