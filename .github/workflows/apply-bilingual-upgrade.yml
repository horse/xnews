name: Apply bilingual length upgrade

on:
  pull_request:
    branches:
      - main
    paths:
      - .upgrade/READY

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'bilingual-length-upgrade'
    runs-on: ubuntu-latest
    steps:
      - name: Check out upgrade branch
        uses: actions/checkout@v4
        with:
          ref: bilingual-length-upgrade
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply and validate bilingual upgrade
        run: python tools/apply_bilingual_upgrade.py

      - name: Commit generated publication files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "content: expand bilingual articles and summaries"
          git push origin HEAD:bilingual-length-upgrade
