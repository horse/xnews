name: Build August 2 daily edition
on:
  push:
    branches: [daily-2026-08-02]
permissions:
  contents: write
jobs:
  build:
    if: contains(github.event.head_commit.message, '[run-daily-20260802]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: daily-2026-08-02
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate edition
        run: python tools/generate_daily_20260802.py
      - name: Install dependencies
        run: python -m pip install -r requirements-wordpress.txt
      - name: Run publisher tests
        run: python -m unittest discover -s tests -v
      - name: Validate WordPress edition
        run: python tools/wordpress_publish.py wordpress/ja/2026-08-02/wordpress.yml
      - name: Check JavaScript
        run: |
          node --check assets/site.js
          node --check assets/ja-site.js
          for f in assets/data-{1..5}.js assets/ja-data-{1..5}.js; do node --check "$f"; done
      - name: Commit generated edition
        run: |
          rm -f .github/workflows/build-daily-20260802.yml tools/generate_daily_20260802.py .daily-20260802-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'content: publish 2026-08-02 bilingual daily edition'
          git push origin HEAD:daily-2026-08-02
