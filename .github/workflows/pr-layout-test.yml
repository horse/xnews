name: Temporary layout verification
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run integrity tests
        run: python -m unittest tests/test_daily_edition_integrity.py -v
      - name: Check JavaScript syntax
        run: node --check assets/site.js
