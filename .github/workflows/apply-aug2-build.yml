name: Diagnose August 2 repair blocks

on:
  pull_request:
    branches: [main]
  push:
    branches: [rebuild-aug2-31]
    paths:
      - ".build/**"
      - ".github/workflows/apply-aug2-build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild-aug2-31
      - name: Hash 500-byte repair blocks
        run: |
          for source in f02r0 f02r1 f02r2; do
            rm -f /tmp/${source}_*
            split -b 500 -d -a 2 .build/${source} /tmp/${source}_
            echo "${source} $(wc -c < .build/${source})"
            sha256sum /tmp/${source}_*
          done
          false
