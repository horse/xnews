name: Diagnose August 2 rebuild chunks

on:
  pull_request:
    branches: [main]
  push:
    branches: [rebuild-aug2-31]
    paths:
      - ".build/**"
      - ".github/workflows/apply-aug2-build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild-aug2-31
      - name: Diagnose uploaded missing chunks
        run: |
          rm -f /tmp/f02_* /tmp/f05_*
          split -b 1000 -d -a 2 .build/fix02 /tmp/f02_
          split -b 1000 -d -a 2 .build/fix05 /tmp/f05_
          echo 'FIX02 BLOCKS'
          sha256sum /tmp/f02_*
          echo 'FIX05 BLOCKS'
          sha256sum /tmp/f05_*
          false
