name: Clean August 2 public copy

on:
  push:
    branches: [rebuild-aug2-31]
    paths:
      - ".github/workflows/cleanup-aug2-public-copy.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild-aug2-31
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Remove editorial process language
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re, shutil

          data_path = Path('assets/data-6.js')
          text = data_path.read_text(encoding='utf-8')
          match = re.search(r'\.concat\((.*)\);\s*$', text, re.S)
          if not match:
              raise SystemExit('Cannot parse assets/data-6.js')
          articles = json.loads(match.group(1))
          zh = {
              'fgo-fes-2026-day1': (3, '8月1日的讨论重点由活动预热转向现场实际内容。会场开放后，舞台企划、展示体验和泳装角色信息在数小时内连续扩散，使FGO相关话题从上午延续到傍晚。'),
              'acees-arena-tour-2026': (3, '当天的热度并非由单一公告触发，而是官方账号更新、巡演内容回顾和成员相关投稿在上午重新汇聚。它反映出巡演进行期间，粉丝关注会随新照片、视频和成员动态反复升温。'),
              'sakura-miko-8th-anniversary': (3, 'VTuber周年直播已经形成稳定的网络节目类型：既回顾过去，也常被用来公布下一阶段活动。8月1日晚的讨论因此从纪念出道历程逐步转向直播中公开的新计划。'),
              'srw-35th-stream': (3, '不少玩家同时提出旧作复刻和未来企划的愿望，但这些讨论并不等同于官方公告。已确认的是，周年直播把《超级机器人大战Y》《DD》的新信息与历代作品回忆连接起来，形成跨世代玩家的集中讨论。'),
              'nanoha-exgv-episode5': (3, '深夜动画的热度通常集中在播出后的短时间内。《奈叶EXGV》第5话虽然未跨越全天，却在凌晨形成高密度讨论，显示老牌系列的新篇章仍有稳定的同步观看群体。'),
              'ultraman-teo-episode5': (3, '周六上午的儿童特摄节目长期拥有稳定的同步观看文化。本周讨论主要围绕第5话的剧情推进、怪兽设计和主人公选择，而不是泛泛回顾整个系列。'),
              'tsugikuru-geinin-2026': (3, '竞赛虽然属于“ENGEI 8”整体编排，但拥有独立规则、参赛者和结果。观众在长时间特别节目之外，又围绕新人艺人的表演和评审结果形成了单独讨论。'),
              'venue101-aug1': (3, '节目标签的上升由不同出演者的粉丝群共同推动。讨论既覆盖完整阵容，也分别聚焦歌曲、镜头和舞台表现；发帖量本身并不能直接代表各表演的客观优劣。'),
              'tif2026-august1': (3, '7月31日开幕后，8月1日的关注转向第二日的实际公演、现场动线和暑热管理。多日活动每天都会产生新的演出内容和到场体验，因此热度继续延续并发生变化。'),
              'bmsg-trainee-summer-stage': (3, '当天讨论包含两项不同信息：六本木舞台是8月1日实际发生的现场活动，票务当落则关系到未来活动的参与资格。两者同时扩散，但并不是同一场演出的两个环节。'),
              'vnl-men-semifinal-2026': (3, '五局鏖战和奖牌形势使讨论延续到日报截止后。具体比分与最终名次应以日本排球协会和赛事官方结果为准，社交平台上的即时反应主要呈现比赛过程中的情绪变化。'),
              'koshien-school-reactions-2026': (3, '整体抽签信息之外，各代表校的对手和地区组合又形成多个地方性话题。冲绳尚学、仙台育英、札幌日大、敦贺气比等校名在同一时段上升，反映出抽签结果被不同地区分别解读。'),
              'baystars-aug1-win': (3, '具体比分、责任投手和正式技术记录以日本棒球机构及球队页面为准。X上的集中讨论更多呈现球迷最在意的逆转、关键打席和赛后口号，构成比赛之外的观众记录。'),
              'marines-aug1-win': (3, '正式比分和个人成绩以日本棒球机构与球队比赛报告为准。“まりほー”等固定胜利口号则把分散在不同地点的球迷情绪汇集成可见话题，成为日本职业棒球社交文化的一部分。'),
              'ohtani-redsox-aug1': (3, '大谷的本垒打与道奇最终落败同时构成当天比赛的完整结果。个人表现受到高度关注，但球队胜负和其健康状态仍需一并观察。'),
              'chibagin-cup-2026': (3, '比赛结果和技术统计应以赛事及俱乐部正式记录为准。可以确认的是，这场季前传统赛事按计划开赛，并围绕阵容、比赛进程和两队关系形成集中讨论。'),
              'high-cost-medical-cap-2026': (3, '现行规则、政府正在讨论的方案和网络上的担忧需要区分。个人适用金额取决于收入、年龄和保险类别，应根据厚生劳动省及所属保险机构的说明确认。'),
              'yen-intervention-followup': (3, '8月1日的关注重点转向潜在干预规模和美日协调机制。正式行动仍未得到确认，市场继续区分消息人士透露的准备工作、交易员解读和政府实际政策决定。'),
              'kumamoto-disaster-response': (3, '救援已进入持续支持阶段，但具体伤亡、物资短缺和恢复进度仍需以熊本当地政府、首相官邸和防卫省更新为准。网络上的未经核实说法不应替代官方灾情信息。'),
              'edogawa-fireworks-2026': (3, '大型花火大会同时带来交通管制、车站拥堵、垃圾处理和安全管理压力。现场观赏体验依赖公共交通、地方居民和工作人员协作，也是城市夏季活动运行的一部分。'),
              'august2-wordplay-tags': (3, '这些日期型标签属于网络文化活动，并非全国公众共同庆祝的法定或传统节日。它们显示平台如何利用统一时间点组织创作、商品宣传和社群互动。'),
          }
          found = set()
          for article in articles:
              if article['slug'] in zh:
                  index, replacement = zh[article['slug']]
                  article['body'][index] = replacement
                  found.add(article['slug'])
          if found != set(zh):
              raise SystemExit(f'Missing Chinese slugs: {set(zh) - found}')
          data_path.write_text('window.XNEWS_ARTICLES=(window.XNEWS_ARTICLES||[]).concat(' + json.dumps(articles, ensure_ascii=False, separators=(',', ':')) + ');\n', encoding='utf-8')

          ja = {
              'fgo-fes-2026-day1.md': ('前日までの予告段階から続く話題ではあるが、8月1日の新しい焦点はイベントが実際に始まり、企画やキャラクター情報が具体的に共有されたことにある。継続的な熱量を、その日の進展に沿って記録するニュースとなった。', '8月1日には、話題の中心が事前告知から会場で実際に行われた企画へ移った。開場後、ステージ、展示、サーヴァント情報が数時間にわたって拡散し、FGO関連語は午前から夕方まで継続した。'),
              'tif2026-august1.md': ('前日のニュースが開幕を伝えたのに対し、8月1日は2日目の実際の公演と運営が焦点になる。複数日に及ぶ催しは、毎日生じる新しい体験に沿って別の記事として記録できる。', '7月31日の開幕を受け、8月1日は2日目の公演内容、会場動線、暑さ対策へ関心が移った。複数日にわたる催しでは、日ごとに新しいステージと来場体験が生まれ、話題も変化しながら続く。'),
              'yen-intervention-followup.md': ('前日から続くニュースだが、8月1日の新しい焦点は規模と協調方法への解釈だった。正式な行動が確認されていないことを明示し、情報源の証言と市場の推測を政策決定として書かないことが重要だ。', '8月1日の関心は、想定される介入規模と日米の連携方法へ移った。正式な市場介入は確認されておらず、銀行への準備要請、取引参加者の解釈、政府の政策決定は区別する必要がある。'),
              'koshien-school-reactions-2026.md': ('大会全体の記事が制度、日程、49代表を扱うのに対し、本稿は抽選結果がSNSで複数の地域物語へ分解された過程を記録する。同じ出来事でも、ニュースの焦点は異なる。', '抽選全体の情報に加え、各代表校の対戦相手と地域の組み合わせが個別の話題になった。沖縄尚学、仙台育英、札幌日大、敦賀気比などの校名が同時に上昇し、結果が地域ごとに受け止められたことが分かる。'),
              'tsugikuru-geinin-2026.md': ('「ENGEI 8」全体の一部ではあるが、独自の参加者、ルール、結果を持つため別のニュースとして成立する。大型編成の記事がテレビイベント全体を扱うのに対し、こちらは新人発掘の競争に焦点を置く。', '「ENGEI 8」の一企画だが、独自の参加者、ルール、結果を持つ。長時間特番全体への反応とは別に、新人芸人のネタと審査結果をめぐる議論が広がった。'),
              'venue101-aug1.md': ('番組全体が話題になっても、出演者ごとの注目度が同じとは限らない。記事では出演者と楽曲を広く記録しつつ、投稿数だけで各ステージの価値を順位付けしない姿勢が必要になる。', '番組タグの上昇は、異なる出演者のファン層が同時に投稿した結果でもある。話題は出演者全体を覆いながら、楽曲、カメラワーク、ステージごとに分かれ、投稿数だけで各パフォーマンスの優劣を判断することはできない。'),
              'onsen-shark-sequel.md': ('独立映画は強い視覚的な発想によって、大規模な宣伝費がなくてもネット上で広がることがある。正式な公開情報が確認できる以上、軽い題材であっても日本のネット文化を示すニュースとして扱える。', '独立映画は強い視覚的な発想によって、大規模な宣伝費がなくてもネット上で広がることがある。続編の正式発表によって、軽快な題材と地域発の映画制作に再び関心が集まった。'),
              'marines-aug1-win.md': ('正式なスコアと個人成績はNPBと球団の試合記録で確認する必要がある。本稿は、定型の勝利フレーズが離れた場所にいるファンの感情を一つの可視的な話題へまとめる過程を扱う。', '正式なスコアと個人成績はNPBと球団の試合記録で確認できる。「まりほー」などの定型句は、離れた場所にいるファンの感情を一つの可視的な話題へまとめ、日本のプロ野球におけるSNS文化の一部になっている。'),
              'bmsg-trainee-summer-stage.md': ('記事では二つを分けて扱う必要がある。六本木のステージは8月1日に実施された公演であり、当落発表は将来のイベントへの参加に関する情報だ。両者が重なってトレンドを形成したと説明できる。', '当日の話題には二つの異なる情報が含まれた。六本木のステージは8月1日に実施された公演で、当落発表は今後のイベントへの参加資格に関するものだった。両者は同時に拡散したが、同じ公演の一部ではない。'),
              'high-cost-medical-cap-2026.md': ('記事では現行制度、政府が検討中の案、SNS上の懸念を区別する必要がある。個人の具体的な上限額は厚生労働省や加入する保険者の案内で確認すべきで、トレンド投稿だけでは判断できない。', '現行制度、政府が検討中の案、SNS上の懸念は区別する必要がある。個人の上限額は所得、年齢、保険区分で異なり、厚生労働省や加入する保険者の案内で確認することになる。'),
              'august2-wordplay-tags.md': ('日付型トレンドはネット文化として報じられるが、全国で正式に祝われる休日のように書くべきではない。共通の時間が創作と消費を組織する仕組みを示す点にニュース価値がある。', '日付型トレンドはネット文化の催しであり、全国的な法定祝日や伝統行事ではない。共通の時刻をきっかけに、創作、商品宣伝、コミュニティーの交流が同時に組織される点が特徴だ。'),
          }
          base = Path('content/ja/2026-08-02')
          for filename, (old, new) in ja.items():
              path = base / filename
              body = path.read_text(encoding='utf-8')
              if old not in body:
                  raise SystemExit(f'Japanese source paragraph missing: {filename}')
              path.write_text(body.replace(old, new), encoding='utf-8')

          forbidden_zh = ['候选', '新报道角度', '报道重点应', '公开稿必须', '本篇与', '本文关注', '新闻价值来自', '应作为当天', '不能当成既定产品']
          for article in articles:
              joined = '\n'.join(article['body'])
              bad = [term for term in forbidden_zh if term in joined]
              if bad:
                  raise SystemExit(f'Chinese editorial trace in {article["slug"]}: {bad}')
          forbidden_ja = ['本稿は', '記事では', '別のニュースとして', 'ニュース価値がある', 'ニュースとして扱える', '別の記事として記録']
          for path in base.glob('*.md'):
              body = path.read_text(encoding='utf-8')
              bad = [term for term in forbidden_ja if term in body]
              if bad:
                  raise SystemExit(f'Japanese editorial trace in {path.name}: {bad}')

          for cache in Path('.').rglob('__pycache__'):
              shutil.rmtree(cache)
          for pyc in Path('.').rglob('*.pyc'):
              pyc.unlink()
          PY
      - name: Verify cleaned edition
        run: |
          python -m unittest tests/test_daily_edition_integrity.py -v
          node --check assets/site.js
      - name: Commit and remove cleanup workflow
        run: |
          rm -f .github/workflows/cleanup-aug2-public-copy.yml
          git config user.name "xnews-build-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Clean editorial process language from August 2 public copy"
          git push origin HEAD:rebuild-aug2-31
